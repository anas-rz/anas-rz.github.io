    Projects:
      - name: "K3IM: Image Models in Keras - Open Source"
        summary: "Developed K3IM, an open-source Keras 3 library implementing 50+ state-of-the-art architectures (ViT, Swin, ConvMixer) with native support for 1D, 2D, and 3D/spatiotemporal data. Engineered for multi-backend compatibility, the project enables seamless execution across TensorFlow, PyTorch, and JAX, integrating advanced research features like Class-Attention and Focal Modulation to provide a flexible, high-performance framework for modern machine learning research."
        highlights:
          - "Link: https://github.com/anas-rz/k3im"
        start_date: 2023-12
        end_date: 2024-02

      - name: "K3 Addons: Addons for Keras 3 - Open Source"
        summary: "Developed K3-Addons, an open-source suite of specialized layers, losses, and activations that extends the Keras 3 ecosystem with multi-backend support (JAX, PyTorch, TensorFlow). I engineered high-performance implementations of modern components, including Attention mechanisms (Mobile ViT, CBAM, ECA), Adaptive Pooling layers parity-matched with PyTorch, and advanced loss functions like GIoU and Sigmoid Focal Cross-Entropy."
        highlights:
          - "Link: https://github.com/anas-rz/k3-addons"
        start_date: 2023-12
        end_date: 2024-03

      - name: "K3NODE: Multibackend Graph Neural Networks - Open Source"
        summary: "Developed K3Node, a high-performance library for Graph Neural Networks (GNNs) built on Keras 3, porting and optimizing core components from Spektral, PyTorch Geometric, and StellarGraph. I implemented a modular suite of GNN layers (GCN, GAT, GraphSAGE, GIN) and advanced aggregation schemes like PowerMean and Softmax pooling, ensuring cross-framework compatibility."
        highlights:
          - "Link: https://github.com/anas-rz/k3-node"
        start_date: 2024-01
        end_date: 2024-02

      - name: "Keras 3 Development - Open Source"
        summary: "Contributed 20+ merged pull requests to the Keras 3 codebase, developing framework-agnostic implementations of complex architectures like DeepLabV3Plus, Vision Transformers, and SimSiam. Optimized core library operations, including patch extraction ops, and authored comprehensive examples for Reinforcement Learning and Computer Vision, ensuring robust performance across JAX, PyTorch, and TensorFlow backends."
        start_date: 2023-07
        end_date: 2023-09
