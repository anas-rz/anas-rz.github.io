    Projects:
      - name: "timm.cpp: Vision Model Inference in C++"
        summary: "High-performance C++ inference engine executing PyTorch/timm vision models via ggml/GGUF with zero Python runtime dependency. Hand-ported 106 vision architectures with strict numerical parity (Cosine Similarity >= 0.999997), up to 25.8x faster cold-start load times via zero-copy mmap, and 3.4x-5.8x calibrated quantization weight reduction."
        highlights:
          - "Stack: C++17, ggml, GGUF, PyTorch, CMake, Docker, CUDA, Metal, Vulkan"
        start_date: 2026-01
        end_date: Present

      - name: "K3Node: Multi-Backend Graph Neural Networks"
        summary: "Next-generation GNN library with 100% public API parity with PyTorch Geometric (PyG), executable across TensorFlow, PyTorch, and JAX. Implemented 65+ conv layers, 26 aggregations, 31 pooling operators, 5 pre-trained Foundation Models (GraphMAE2, Graphormer, GraphGPS, GROVER, Mole-BERT), and 700+ unit tests per backend."
        highlights:
          - "Link: https://github.com/anas-rz/k3-node"
        start_date: 2024-01
        end_date: Present

      - name: "K3IM: Keras 3 Image Models Zoo"
        summary: "Open-source deep learning library providing 50+ modern vision and spatiotemporal architectures across 1D, 2D, and 3D data modalities with cross-backend support on TensorFlow, PyTorch, and JAX. Features hand-implemented ViTs, Swin, ConvMixer, gMLP, and MLP-Mixer."
        highlights:
          - "Link: https://github.com/anas-rz/k3im"
        start_date: 2023-12
        end_date: Present

      - name: "Keras-Climate: Earth Observation & Climate Modeling"
        summary: "Open-source multi-backend framework for remote sensing, climate forecasting, and Earth observation. Implemented 4-band UNet and SegFormer, PatchTST for multivariate forecasting, ConvLSTMNowcaster, and the NASA/IBM Prithvi geospatial foundation model."
        highlights:
          - "Link: https://github.com/anas-rz/keras-climate"
        start_date: 2026-01
        end_date: Present

      - name: "AutoMAS: Automated Multi-Agent System Generation"
        summary: "Autonomous framework generating functional multi-agent software systems from natural language code intent across 5 cooperative layers. Evaluated on 91 real-world agentic systems with 82.75% Pass@1 and 89.78% accuracy. Published in IEEE QRS 2026."
        start_date: 2025-06
        end_date: 2026-03

      - name: "NeuroGenesis: LLM-Driven Architecture Search"
        summary: "Reasoning-guided Neural Architecture Search (NAS) using LLMs to formulate and justify iterative model designs across audio, video, images, and multivariate time-series data with 20 candidate backbones. Published in IEEE QRS 2026."
        start_date: 2025-08
        end_date: 2026-03

      - name: "LocatorGraph: GNN Fault Localization for Sequence Models"
        summary: "Novel fault localization framework converting sequence model code into TraceGraphs to localize deep learning bugs. Achieved 89.46% AUC on bug identification and 81.54% accuracy in pinpointing faulty nodes across 152 models. Published in Empirical Software Engineering (EMSE 2025)."
        start_date: 2024-01
        end_date: 2025-05

      - name: "RuleBoost: Neuro-Symbolic Deepfake Detection"
        summary: "Neuro-symbolic detector fusing deep perceptual representations (gMLP, ViT, TokenLearner) with geometric facial rules. Achieved 96.19% AUC on World Leaders Dataset and 95.44% on FaceForensics++. Awarded Best Poster Award at IEEE IJCB 2024."
        start_date: 2023-09
        end_date: 2024-09

      - name: "DeepTrAnS: Unsupervised Server Telemetry Anomaly Detection"
        summary: "MLP-Mixer-based unsupervised anomaly detection framework for high-dimensional server telemetry. Achieved 99.88% precision, 99.73% recall, and 99.81% F1-score, significantly outperforming TranAD and OmniAnomaly. Published in IEEE ICSC 2025."
        start_date: 2024-03
        end_date: 2025-01

      - name: "Real-Time Food Delivery Ecosystem & Apollo GraphQL Backend"
        summary: "Production-grade microservice and client ecosystem featuring an Apollo Server 4 GraphQL backend with real-time WebSocket subscriptions, React 19 web frontend, and cross-platform React Native / Expo SDK 53 customer and manager mobile apps."
        start_date: 2024-06
        end_date: 2024-12
