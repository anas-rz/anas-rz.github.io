        summary: "Conduct advanced academic research and teach courses within the Computer Science department."
        highlights:
          - "Software Engineering & LLM Agent Research: Investigate automated software engineering techniques, including Graph Neural Networks for fault localization in machine learning systems and the development of multimodal automated machine learning (AutoML) pipelines. Automated Software engineering using LLM agents."
          - "Computer Vision Research and Development: Conduct research on deepfake detection using Vision Transformers, MLP-Mixer, gMLP, FNet, and Convolutional Neural Networks. Perform experiments in both vision-only and multimodal, neuro-symbolic settings on large-scale datasets including DFDC (124K videos) and FakeAVCeleb (21K videos)."
          - "Deep Forgery Detector: Designed and developed in-house Deep Forgery Detector, a modular framework for benchmarking and comparing video deepfake detection algorithms, with extensible architecture enabling rapid integration of new research models."
          - "Forensic Examiner: Developed a flexible framework for evaluating audio spoofing detection algorithms, built using Python, PyTorch, TensorFlow, and Streamlit for interactive experimentation and analysis."
          - "Teaching Assistant: Assisted in courses on Machine Learning and Software Testing, including grading assignments, supporting laboratory sessions, and mentoring students on programming and machine learning projects."

