        highlights:
          - "IoT Data Pipeline: Designed and implemented automated data ingestion pipelines for time-series data from building automation systems using BACnet, enabling large-scale monitoring of HVAC and building efficiency metrics."
          - "Edge AI Infrastructure: Developed and deployed edge-based data processing and monitoring solutions on Nvidia Jetson Nano devices for real-time building analytics."
          - "Data Visualization & Deployment: Built and containerized data visualization and monitoring dashboards for building efficiency products using InfluxDB and Grafana, and deployed them on Linux-based edge devices."
          - "Tech Stack: Python, Linux (Arch), Nvidia Jetson Nano, Volttron, Docker, InfluxDB, Grafana, Bash."

